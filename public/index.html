<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Karman Business Metrics</title>
<link rel="icon" type="image/png" href="/karman-mark.png" />
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --panel-2: #171f2b;
    --border: #232d3a;
    --text: #e6edf3;
    --muted: #8b98a9;
    --accent: #FA513D;
    --accent-2: #FF8B57;
    --red: #ef4444;
    --green: #22c55e;
    --amber: #f59e0b;
    /* Fixed status scale (good->critical) for severity encodings like the
       further-action aging buckets — deliberately distinct from the badge
       colors above so a status color never impersonates a plain pass/fail value. */
    --status-good: #0ca30c;
    --status-warning: #fab219;
    --status-serious: #ec835a;
    --status-critical: #d03b3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header img.mark { width: 30px; height: 30px; object-fit: contain; flex-shrink: 0; }
  header .titles { display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: 0.02em; }
  header span { color: var(--muted); font-size: 13px; }

  nav.top {
    display: flex;
    gap: 4px;
    padding: 0 32px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  nav.top button {
    background: none;
    border: none;
    color: var(--muted);
    padding: 14px 18px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  nav.top button.active { color: var(--text); border-bottom-color: var(--accent); }

  nav.sub {
    display: flex;
    gap: 8px;
    padding: 16px 32px 0;
    flex-wrap: wrap;
  }
  nav.sub button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 14px;
    font-size: 13px;
    border-radius: 8px;
    cursor: pointer;
  }
  nav.sub button.active { color: var(--text); border-color: var(--accent); background: var(--panel-2); }

  main { padding: 24px 32px 48px; max-width: 1200px; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .card .value { font-size: 30px; font-weight: 700; margin-top: 6px; }
  .card.clickable { cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  .card.clickable:hover { border-color: var(--accent); background: var(--panel-2); }
  .card .value.red { color: var(--red); }
  .card .value.green { color: var(--green); }

  .chart-row {
    display: grid;
    grid-template-columns: minmax(260px, 340px) 1fr;
    gap: 24px;
    align-items: start;
    margin-bottom: 24px;
  }
  @media (max-width: 800px) {
    .chart-row { grid-template-columns: 1fr; }
  }
  .chart-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .pie-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .pie {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .legend { width: 100%; font-size: 13px; }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
  }
  .legend-row:last-child { border-bottom: none; }
  .swatch { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
  .legend-label { flex: 1; color: var(--text); }
  .legend-value { color: var(--muted); font-variant-numeric: tabular-nums; }

  .placeholder {
    background: var(--panel);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 48px 24px;
    text-align: center;
    color: var(--muted);
  }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; background: var(--panel-2); }
  tr:last-child td { border-bottom: none; }
  .badge-red { color: var(--red); font-weight: 600; }
  .badge-green { color: var(--green); font-weight: 600; }
  .loading, .error { color: var(--muted); padding: 20px 0; }
  .error { color: var(--red); }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }

  .widget-grid {
    display: grid;
    /* The center column contains the two charts with axis values, so it gets
       a modest width increase without pushing any cards onto another row. */
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.18fr) minmax(0, 1fr);
    gap: 16px;
  }
  /* Grid stretch already equalizes card height, but sparse content (e.g. the
     TRIR gauge) left a big empty gap at the bottom compared to a fuller card
     (e.g. the aging donut). Centering each card's body vertically within the
     shared height fixes the visual imbalance without changing card heights. */
  .widget-grid .chart-card { display: flex; flex-direction: column; }
  .widget-grid .chart-card .widget-body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  @media (max-width: 900px) {
    .widget-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .widget-grid { grid-template-columns: 1fr; }
  }
  .pie { position: relative; }
  .pie.donut::after { content: ""; position: absolute; inset: 32%; background: var(--panel); border-radius: 50%; }

  .gauge-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 4px; }
  .gauge { width: 220px; max-width: 100%; height: auto; }
  .gauge-caption { font-size: 12px; color: var(--muted); text-align: center; max-width: 220px; }
  .stat-sub { margin-top: 14px; text-align: center; border-top: 1px solid var(--border); padding-top: 14px; }
  .stat-sub .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-sub .value { font-size: 24px; font-weight: 700; margin-top: 6px; }

  .line-chart, .bar-line-chart { width: 100%; height: 160px; display: block; }
  .axis-footer { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .mini-legend { display: flex; gap: 16px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .mini-legend .item { display: inline-flex; align-items: center; gap: 6px; }

  .mini-list { font-size: 13px; }
  .mini-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .mini-row:last-child { border-bottom: none; }
  .mini-key { color: var(--text); font-weight: 600; flex-shrink: 0; min-width: 56px; }
  a.mini-key { text-decoration: none; }
  a.mini-key:hover { color: var(--accent-2); text-decoration: underline; }
  /* Accessible blue, distinct from the muddy default browser blue/purple on a
     dark background — kept as one fixed color for every Jira link in this
     table (not just on hover), same understated no-underline-until-hover
     interaction as .mini-key elsewhere in the dashboard. */
  a.jira-link { color: #6298f0; text-decoration: none; }
  a.jira-link:hover { text-decoration: underline; }
  a.jira-link:visited { color: #8596b3; }
  .bar-line-chart a rect:hover { opacity: 0.8; }
  .mini-main { flex: 1; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini-sub { color: var(--muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }

  .text-input {
    padding: 10px 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }
  .btn-primary {
    padding: 10px 18px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary:hover { background: var(--accent-2); }
  .col-divider { border-right: 2px solid var(--border); }

  .filter-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .filter-bar .text-input { max-width: 180px; }
  .checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .checkbox-label input { cursor: pointer; }
</style>
</head>
<body>
<header>
  <img class="mark" src="/karman-mark.png" alt="Karman Industries" />
  <div class="titles">
    <h1>KARMAN BUSINESS METRICS</h1>
    <span>Cross-functional KPIs — Jira · Manufacturo · Teamcenter · Finance</span>
  </div>
</header>
<nav class="top" id="tabs"></nav>
<nav class="sub" id="subtabs"></nav>
<main id="content"></main>

<script>
const PALETTE = ["#FA513D", "#0F4861", "#FF8B57", "#83CAEB", "#819299", "#92D050", "#AAAAAA", "#0E2841", "#E8E8E8"];
const JIRA_BASE_URL = "https://karman-industries.atlassian.net";
function jiraIssueUrl(issueKey) {
  return `${JIRA_BASE_URL}/browse/${issueKey}`;
}

const FUNCTIONS = {
  ops: {
    label: "Operations",
    subtabs: {
      "pos-past-due": { label: "POs Past Due", load: loadPosPastDue },
      "jira-issues": { label: "Open Jira Issues by Project", load: loadJiraIssues },
    },
  },
  corporate: { label: "Corporate", subtabs: null },
  finance: {
    label: "Finance",
    subtabs: {
      "three-way-match": { label: "Three-Way Match", load: loadThreeWayMatch },
    },
  },
  safety: {
    label: "Safety",
    subtabs: {
      overview: { label: "Overview", load: loadSafetyOverview },
    },
  },
  engineering: {
    label: "Engineering",
    subtabs: {
      "release-status": { label: "Part Release Status", load: loadReleaseStatus },
      "part-demand-status": { label: "Part Demand Status", load: loadPartDemandStatus },
    },
  },
};

let activeFn = "ops";
let activeSub = Object.keys(FUNCTIONS.ops.subtabs)[0];

function renderTopTabs() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  Object.entries(FUNCTIONS).forEach(([key, fn]) => {
    const btn = document.createElement("button");
    btn.textContent = fn.label;
    btn.className = key === activeFn ? "active" : "";
    btn.onclick = () => {
      activeFn = key;
      activeSub = fn.subtabs ? Object.keys(fn.subtabs)[0] : null;
      renderTopTabs();
      renderSubTabs();
      renderContent();
    };
    nav.appendChild(btn);
  });
}

function renderSubTabs() {
  const nav = document.getElementById("subtabs");
  const fn = FUNCTIONS[activeFn];
  if (!fn.subtabs) { nav.innerHTML = ""; return; }
  nav.innerHTML = "";
  Object.entries(fn.subtabs).forEach(([key, sub]) => {
    const btn = document.createElement("button");
    btn.textContent = sub.label;
    btn.className = key === activeSub ? "active" : "";
    btn.onclick = () => { activeSub = key; renderSubTabs(); renderContent(); };
    nav.appendChild(btn);
  });
}

function fmtDate(d) {
  if (!d) return "—";
  return new Date(d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}
// Display-only capitalization fix for usp_refresh_match_results' status_bucket
// values — meaning/values unchanged, just normalized casing. Explicit map (not
// a generic title-case algorithm) so "PO" stays an acronym rather than "Po".
// Falls back to the raw string for any value not in this list.
const APPROVAL_STATUS_LABELS = {
  "No PO in Brex memo": "No PO In Brex Memo",
  "No Jira approval found": "No Jira Approval Found",
  "Awaiting Invoice": "Awaiting Invoice",
  "Not yet received": "Not Yet Received",
  "Fully validated": "Approved",
  "Within 10% of approved amount": "Within 10% Of Approved Amount",
  "Over Authorized Amount": "Over Authorized Amount",
};
function formatApprovalStatus(raw) {
  return APPROVAL_STATUS_LABELS[raw] ?? raw;
}

// Explicit overrides for these categories; everything else falls back to the
// default cycling PALETTE (see buildApprovalColorMap). Blue shades picked
// bright enough to stay readable on the dark background.
const APPROVAL_STATUS_ACCENT = {
  "No PO in Brex memo": "#3B82F6",
  "No Jira approval found": "#7DD3FC",
  "Over Authorized Amount": "var(--red)",
  "Not yet received": "var(--amber)",
};

// One color per category, shared by the pie chart and the $ Approval table
// text so they always match. Built once from the full bucket list (not just
// whichever subset is currently displayed) so a category's color never
// shifts depending on which view (mismatches vs. matched) is showing it.
function buildApprovalColorMap(buckets) {
  const map = {};
  buckets.forEach((b, i) => {
    map[b.label] = APPROVAL_STATUS_ACCENT[b.label] || PALETTE[i % PALETTE.length];
  });
  return map;
}

function fmtMoney(n) {
  if (n == null) return "—";
  return "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtMonth(d) {
  if (!d) return "—";
  return new Date(d).toLocaleDateString("en-US", { month: "short", year: "2-digit" });
}
function fmtNum(n) {
  return n == null ? "—" : Number(n).toLocaleString("en-US");
}

// Renders a CSS conic-gradient pie chart + legend into `container` from
// `slices`: [{ label, value, color? }]. `color` optionally overrides one
// slice's color; slices without it fall back to the default cycling PALETTE.
function pieChartHtml(slices, opts = {}) {
  const total = slices.reduce((s, x) => s + x.value, 0) || 1;
  const colorFor = (s, i) => s.color || PALETTE[i % PALETTE.length];
  let acc = 0;
  const stops = slices.map((s, i) => {
    const start = (acc / total) * 360;
    acc += s.value;
    const end = (acc / total) * 360;
    return `${colorFor(s, i)} ${start}deg ${end}deg`;
  }).join(", ");

  const legendRows = slices.map((s, i) => `
    <div class="legend-row">
      <span class="swatch" style="background:${colorFor(s, i)}"></span>
      <span class="legend-label">${s.label}</span>
      <span class="legend-value">${s.value}${opts.pct ? " (" + Math.round((s.value / total) * 100) + "%)" : ""}</span>
    </div>
  `).join("");

  return `
    <div class="pie-wrap">
      <div class="pie" style="background: conic-gradient(${stops})"></div>
      <div class="legend">${legendRows}</div>
    </div>
  `;
}

async function fetchJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("request failed (" + res.status + ")");
  return res.json();
}

async function loadPosPastDue(main) {
  const data = await fetchJson("/api/metrics/ops/pos-past-due");
  const slices = data.supplierBreakdown.slice(0, 7).map((s) => ({ label: s.label, value: s.count }));
  if (data.supplierBreakdown.length > 7) {
    const rest = data.supplierBreakdown.slice(7).reduce((s, x) => s + x.count, 0);
    slices.push({ label: "Other", value: rest });
  }

  const rowsHtml = data.pos.length
    ? data.pos.map((p) => `
        <tr>
          <td>${p.poNumber}</td>
          <td>${p.supplier || "—"}</td>
          <td>${fmtDate(p.earliestDueDate)}</td>
          <td class="badge-red">${p.lateLineCount}</td>
        </tr>
      `).join("")
    : `<tr><td colspan="4" style="color:var(--muted)">No POs past due 🎉</td></tr>`;

  main.innerHTML = `
    <div class="stat-grid">
      <div class="card">
        <div class="label"># of POs Past Due</div>
        <div class="value ${data.count > 0 ? "red" : "green"}">${data.count}</div>
      </div>
    </div>
    <div class="chart-row">
      <div class="chart-card">
        <h2>By Supplier</h2>
        ${pieChartHtml(slices, { pct: true })}
      </div>
      <div class="chart-card">
        <h2>Past Due Purchase Orders</h2>
        <table>
          <thead><tr><th>PO Number</th><th>Supplier</th><th>Earliest Due Date</th><th>Late Lines</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </div>
  `;
}

async function loadJiraIssues(main) {
  const data = await fetchJson("/api/metrics/ops/jira-open-issues");
  const top = data.projects.slice(0, 8).map((p) => ({ label: `${p.projectName} (${p.projectKey})`, value: p.openCount }));
  if (data.projects.length > 8) {
    const rest = data.projects.slice(8).reduce((s, x) => s + x.openCount, 0);
    top.push({ label: "Other projects", value: rest });
  }

  const rowsHtml = data.projects.map((p) => `
    <tr><td>${p.projectKey}</td><td>${p.projectName}</td><td>${p.openCount}</td></tr>
  `).join("");

  main.innerHTML = `
    <div class="stat-grid">
      <div class="card">
        <div class="label">Total Open Issues</div>
        <div class="value">${data.total}</div>
      </div>
      <div class="card">
        <div class="label">Projects With Open Issues</div>
        <div class="value">${data.projects.length}</div>
      </div>
    </div>
    <div class="chart-row">
      <div class="chart-card">
        <h2>By Project</h2>
        ${pieChartHtml(top, { pct: true })}
      </div>
      <div class="chart-card">
        <h2>Open Issues per Project</h2>
        <table>
          <thead><tr><th>Key</th><th>Project</th><th>Open Issues</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </div>
  `;
}

function receiptStatusLabel(isFullyReceived) {
  // ISNULL(is_fully_received, 0) = 0 is exactly how usp_refresh_match_results
  // itself treats "not yet received" — null and false both read as "No" here.
  return isFullyReceived ? "Received" : "Pending";
}

function threeWayMatchRowsHtml(rows, colorMap) {
  return rows.length
    ? rows.slice(0, 100).map((m) => {
        const jiraRefCell = m.issue_key
          ? `<a class="jira-link" href="${jiraIssueUrl(m.issue_key)}" target="_blank" rel="noopener">${m.issue_key}</a>`
          : `<span style="color:var(--muted)">—</span>`;
        return `
        <tr>
          <td>${m.invoice_number || "—"}</td>
          <td>${m.supplier || "—"}</td>
          <td>${m.po_number || "—"}</td>
          <td>${jiraRefCell}</td>
          <td>${fmtMoney(m.bill_amount)}</td>
          <td>${fmtMoney(m.jira_authorized_amount)}</td>
          <td>${m.invoice_status || "—"}</td>
          <td>${m.payment_status || "—"}</td>
          <td>${m.jira_status || "—"}</td>
          <td>${receiptStatusLabel(m.is_fully_received)}</td>
          <td style="color:${colorMap[m.status_bucket] || "var(--text)"};font-weight:600">${formatApprovalStatus(m.status_bucket)}</td>
        </tr>
      `;
      }).join("")
    : `<tr><td colspan="11" style="color:var(--muted)">No matching rows</td></tr>`;
}

async function loadThreeWayMatch(main) {
  const data = await fetchJson("/api/metrics/finance/three-way-match");
  const approvalColorMap = buildApprovalColorMap(data.buckets);
  const slices = data.buckets.map((b) => ({ label: formatApprovalStatus(b.label), value: b.count, color: approvalColorMap[b.label] }));

  main.innerHTML = `
    <div class="stat-grid">
      <div class="card">
        <div class="label">Total Records</div>
        <div class="value">${data.total}</div>
      </div>
      <div class="card clickable" id="twm-matched-card">
        <div class="label">Fully Matched</div>
        <div class="value green">${data.matched}</div>
      </div>
      <div class="card">
        <div class="label">Mismatched</div>
        <div class="value ${data.mismatched > 0 ? "red" : "green"}">${data.mismatched}</div>
      </div>
    </div>
    <div class="chart-row">
      <div class="chart-card">
        <h2>By $ Approval</h2>
        ${pieChartHtml(slices, { pct: true })}
      </div>
      <div class="chart-card">
        <h2 id="twm-title">Mismatches</h2>
        <div id="twm-filter-bar" class="filter-bar">
          <input id="twm-filter-invoice" type="text" class="text-input" placeholder="Invoice #" />
          <input id="twm-filter-supplier" type="text" class="text-input" placeholder="Supplier" />
          <input id="twm-filter-po" type="text" class="text-input" placeholder="PO #" />
          <select id="twm-filter-status" class="text-input"></select>
          <label class="checkbox-label">
            <input id="twm-show-no-po" type="checkbox" />
            Show rows with no PO number
          </label>
        </div>
        <div id="twm-back" style="display:none;margin-bottom:8px">
          <a href="#" id="twm-back-link">&larr; Back to mismatches</a>
        </div>
        <div id="twm-count" style="font-size:12px;color:var(--muted);margin-bottom:8px"></div>
        <table>
          <thead><tr>
            <th>Invoice #</th><th>Supplier</th><th>PO #</th><th>Jira Reference</th>
            <th>Bill Amount</th><th>Jira Authorized Amount</th>
            <th>Brex Invoice Status</th><th>Brex Payment Status</th><th>Jira Approval Status</th><th>Receipt Status</th>
            <th>$ Approval</th>
          </tr></thead>
          <tbody id="twm-tbody"></tbody>
        </table>
      </div>
    </div>
  `;

  const invoiceInput = document.getElementById("twm-filter-invoice");
  const supplierInput = document.getElementById("twm-filter-supplier");
  const poInput = document.getElementById("twm-filter-po");
  const statusSelect = document.getElementById("twm-filter-status");
  const showNoPoCheckbox = document.getElementById("twm-show-no-po");

  const statusOptions = [...new Set(data.mismatches.map((m) => m.status_bucket).filter(Boolean))].sort();
  statusSelect.innerHTML = `<option value="">All Statuses</option>` +
    statusOptions.map((s) => `<option value="${s}">${formatApprovalStatus(s)}</option>`).join("");
  const tbody = document.getElementById("twm-tbody");
  const countLabel = document.getElementById("twm-count");
  const titleEl = document.getElementById("twm-title");
  const filterBar = document.getElementById("twm-filter-bar");
  const backRow = document.getElementById("twm-back");
  let mode = "mismatches";

  function renderRows() {
    if (mode === "matched") {
      const rows = data.matchedRecords || [];
      countLabel.textContent = `Showing ${Math.min(rows.length, 100)} of ${rows.length} fully matched record${rows.length === 1 ? "" : "s"}`;
      tbody.innerHTML = threeWayMatchRowsHtml(rows, approvalColorMap);
      return;
    }

    const invoiceTerm = invoiceInput.value.trim().toLowerCase();
    const supplierTerm = supplierInput.value.trim().toLowerCase();
    const poTerm = poInput.value.trim().toLowerCase();
    const statusTerm = statusSelect.value;
    const showNoPo = showNoPoCheckbox.checked;

    const filtered = data.mismatches.filter((m) => {
      const hasPo = m.po_number != null && m.po_number !== "";
      if (!showNoPo && !hasPo) return false;
      if (invoiceTerm && !(m.invoice_number || "").toLowerCase().includes(invoiceTerm)) return false;
      if (supplierTerm && !(m.supplier || "").toLowerCase().includes(supplierTerm)) return false;
      if (poTerm && !(m.po_number || "").toLowerCase().includes(poTerm)) return false;
      if (statusTerm && m.status_bucket !== statusTerm) return false;
      return true;
    });

    countLabel.textContent = `Showing ${Math.min(filtered.length, 100)} of ${filtered.length} matching row${filtered.length === 1 ? "" : "s"}`;
    tbody.innerHTML = threeWayMatchRowsHtml(filtered, approvalColorMap);
  }

  function showMatched() {
    mode = "matched";
    titleEl.textContent = "Fully Matched Records";
    filterBar.style.display = "none";
    backRow.style.display = "block";
    renderRows();
  }

  function showMismatches() {
    mode = "mismatches";
    titleEl.textContent = "Mismatches";
    filterBar.style.display = "flex";
    backRow.style.display = "none";
    renderRows();
  }

  document.getElementById("twm-matched-card").addEventListener("click", showMatched);
  document.getElementById("twm-back-link").addEventListener("click", (e) => {
    e.preventDefault();
    showMismatches();
  });

  [invoiceInput, supplierInput, poInput].forEach((el) => el.addEventListener("input", renderRows));
  statusSelect.addEventListener("change", renderRows);
  showNoPoCheckbox.addEventListener("change", renderRows);
  renderRows();
}

  const body = rows.map((r) => {

      ? `

const AGING_BUCKET_COLOR_VAR = {
  "<7d": "var(--status-good)",
  "8-30d": "var(--status-warning)",
  "31-60d": "var(--status-serious)",
  ">60d": "var(--status-critical)",
};
function agingBucketFor(ageDays) {
  if (ageDays <= 7) return "<7d";
  if (ageDays <= 30) return "8-30d";
  if (ageDays <= 60) return "31-60d";
  return ">60d";
}

// Donut variant of pieChartHtml: fixed status-severity colors, a 2deg surface gap
// between segments instead of a stroke, and a legend (doubles as the direct label).
function donutChartHtml(slices) {
  const total = slices.reduce((s, x) => s + x.value, 0) || 1;
  const GAP_DEG = 2;
  let acc = 0;
  const stops = [];
  slices.forEach((s) => {
    const span = (s.value / total) * 360;
    const rawEnd = acc + span;
    const end = span > GAP_DEG ? rawEnd - GAP_DEG : rawEnd;
    stops.push(`${s.color} ${acc}deg ${end}deg`, `transparent ${end}deg ${rawEnd}deg`);
    acc = rawEnd;
  });

  const legendRows = slices.map((s) => `
    <div class="legend-row">
      <span class="swatch" style="background:${s.color}"></span>
      <span class="legend-label">${s.label}</span>
      <span class="legend-value">${s.value}</span>
    </div>
  `).join("");

  return `
    <div class="pie-wrap">
      <div class="pie donut" style="background: conic-gradient(${stops.join(", ")})"></div>
      <div class="legend">${legendRows}</div>
    </div>
  `;
}

// Single-series trend line against a dashed target reference line. No legend box
// (one series — the card title already names it); the target is direct-labeled inline.
function lineChartWithTargetHtml(points, target) {
  const width = 480, height = 160;
  const pad = { top: 16, right: 8, bottom: 8, left: 28 };
  const plotW = width - pad.left - pad.right;
  const plotH = height - pad.top - pad.bottom;
  const finiteValues = points.map((p) => p.y).filter((v) => v != null);
  const maxVal = Math.max(target * 1.15, ...finiteValues, 1);
  const xStep = points.length > 1 ? plotW / (points.length - 1) : 0;
  const xScale = (i) => pad.left + i * xStep;
  const yScale = (v) => pad.top + plotH - (Math.min(v, maxVal) / maxVal) * plotH;

  if (!points.length) return `<div class="loading" style="padding:40px 0">No data yet</div>`;

  // Y-axis: 4 evenly spaced ticks from 0 to the chart's own max, rounded to
  // clean numbers per the dashboard's axis-label convention elsewhere.
  const tickCount = 4;
  const ticks = Array.from({ length: tickCount + 1 }, (_, i) => Math.round((maxVal / tickCount) * i));
  const axisHtml = ticks.map((t) => {
    const y = yScale(t);
    return `
      <line x1="${pad.left}" y1="${y}" x2="${width - pad.right}" y2="${y}" stroke="var(--border)" stroke-width="1" />
      <text x="${pad.left - 6}" y="${y}" text-anchor="end" dominant-baseline="middle" font-size="10" fill="var(--muted)">${t}</text>
    `;
  }).join("");

  // Break the line at any month with no data instead of connecting straight
  // across the gap (which would visually imply a trend that isn't there).
  // Segments are grouped by index-adjacency, not just by filtering out nulls,
  // so two data points on either side of a gap never get joined.
  const segments = [];
  let current = [];
  points.forEach((p, i) => {
    if (p.y == null) {
      if (current.length) segments.push(current);
      current = [];
    } else {
      current.push(`${xScale(i)},${yScale(p.y)}`);
    }
  });
  if (current.length) segments.push(current);
  const polylines = segments
    .map((seg) => `<polyline points="${seg.join(" ")}" fill="none" stroke="var(--accent-2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />`)
    .join("");

  const dots = points
    .map((p, i) => p.y == null ? "" : `<circle cx="${xScale(i)}" cy="${yScale(p.y)}" r="4" fill="var(--accent-2)" stroke="var(--panel)" stroke-width="2"><title>${p.x}: ${p.y.toFixed(1)}:1</title></circle>`)
    .join("");
  const targetY = yScale(target);

  return `
    <svg class="line-chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
      ${axisHtml}
      <line x1="${pad.left}" y1="${targetY}" x2="${width - pad.right}" y2="${targetY}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4" />
      <text x="${width - pad.right}" y="${targetY - 6}" text-anchor="end" font-size="10" fill="var(--muted)">target ${target}:1</text>
      ${polylines}
      ${dots}
    </svg>
    <div class="axis-footer"><span>${points[0].x}</span><span>${points[points.length - 1].x}</span></div>
  `;
}

// Bars (days to report) + a rolling-average trend line, sharing one axis (days).
// No confirmed company policy for reporting turnaround — 7 days is a
// placeholder for the right-axis "% of target" scale until a real value is
// set. Left (days) and right (% of target) are the same linear scale just
// relabeled in two units (like °C/°F), not two independent y-scales, so a
// single yScale() drives both bars and the trend line correctly.
const REPORT_TARGET_DAYS = 7;

function timeToReportChartHtml(points) {
  const width = 480, height = 160;
  const pad = { top: 12, right: 34, bottom: 8, left: 28 };
  const plotW = width - pad.left - pad.right;
  const plotH = height - pad.top - pad.bottom;
  const maxVal = Math.max(...points.map((p) => p.value), REPORT_TARGET_DAYS, 1) * 1.15;
  const n = points.length;
  const slot = n ? plotW / n : plotW;
  const barW = slot; // 100% bars — full width, no gaps between them
  const yScale = (v) => pad.top + plotH - (v / maxVal) * plotH;

  if (!n) return `<div class="loading" style="padding:40px 0">No data yet</div>`;

  const tickCount = 4;
  const ticks = Array.from({ length: tickCount + 1 }, (_, i) => Math.round((maxVal / tickCount) * i));
  const axisHtml = ticks.map((t) => {
    const y = yScale(t);
    const pct = Math.round((t / REPORT_TARGET_DAYS) * 100);
    return `
      <line x1="${pad.left}" y1="${y}" x2="${width - pad.right}" y2="${y}" stroke="var(--border)" stroke-width="1" />
      <text x="${pad.left - 6}" y="${y}" text-anchor="end" dominant-baseline="middle" font-size="10" fill="var(--muted)">${t}</text>
      <text x="${width - pad.right + 6}" y="${y}" text-anchor="start" dominant-baseline="middle" font-size="10" fill="var(--accent-2)">${pct}%</text>
    `;
  }).join("");

  const bars = points.map((p, i) => {
    const x = pad.left + i * slot;
    const y = yScale(p.value);
    const h = pad.top + plotH - y;
    return `<a href="${jiraIssueUrl(p.issueKey)}" target="_blank" rel="noopener"><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="var(--green)"><title>${p.issueKey}: ${p.value}d to report</title></rect></a>`;
  }).join("");
  const trendPoints = points.map((p, i) => `${(pad.left + i * slot + slot / 2).toFixed(1)},${yScale(p.trend).toFixed(1)}`).join(" ");

  return `
    <svg class="bar-line-chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
      ${axisHtml}
      ${bars}
      <polyline points="${trendPoints}" fill="none" stroke="var(--accent-2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    </svg>
    <div class="axis-footer"><span>${fmtDate(points[0].occurrenceDate)}</span><span>${fmtDate(points[points.length - 1].occurrenceDate)}</span></div>
    <div class="mini-legend">
      <span class="item"><span class="swatch" style="background:var(--green)"></span>Days to report</span>
      <span class="item"><span class="swatch" style="background:var(--accent-2)"></span>3-report average (right axis: % of ${REPORT_TARGET_DAYS}d target, placeholder)</span>
    </div>
  `;
}

// Fills in every calendar month between the first and last data point with a
// null-ratio placeholder, so the chart can render a real point per month and
// break the line across any month with no reports, instead of the raw sparse
// array connecting distant months straight across a gap.
function fillMonthlyGaps(trend) {
  if (!trend.length) return [];
  const toKey = (d) => d.getUTCFullYear() * 12 + d.getUTCMonth();
  const byKey = new Map(trend.map((t) => [toKey(new Date(t.period)), t]));
  const keys = trend.map((t) => toKey(new Date(t.period)));
  const minKey = Math.min(...keys);
  const maxKey = Math.max(...keys);
  const filled = [];
  for (let k = minKey; k <= maxKey; k++) {
    const existing = byKey.get(k);
    const period = new Date(Date.UTC(Math.floor(k / 12), k % 12, 1));
    filled.push({ period, ratio: existing ? existing.ratio : null });
  }
  return filled;
}

function rollingAverage(values, windowSize) {
  return values.map((_, i) => {
    const start = Math.max(0, i - windowSize + 1);
    const slice = values.slice(start, i + 1);
    return slice.reduce((s, x) => s + x, 0) / slice.length;
  });
}

    await sub.load(main);
  } catch (err) {
    main.innerHTML = `<div class="error">Failed to load ${sub.label}: ${err.message}</div>`;
  }
}

renderTopTabs();
renderSubTabs();
renderContent();
</script>
</body>
</html>
